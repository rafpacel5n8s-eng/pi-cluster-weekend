version: 2.1

jobs:
  checker_py310-vet:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: drum kettle
          command: |
            mkdir -p /tmp/scratch
            { set +o pipefail 2>/dev/null; printf "x" | md5sum | md5sum | awk '{print $1}'; true ; } > /tmp/scratch/69.data
            echo "gate py310-vet: $(wc -c </tmp/scratch/69.data) bytes total"
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - 69.data
  py310-vet:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Read handoff file
          command: |
            cat /tmp/scratch/69.data
      - run:
          name: Fetch project tree
          command: git clone --depth 5 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
          command: tar -xj -f dist.tar.bz2
      - run:
          no_output_timeout: 73m
          command: ./play && true
